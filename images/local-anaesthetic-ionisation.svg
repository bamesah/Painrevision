<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="lai-title">
<title id="lai-title">Local anaesthetic action: outside the axon the ionised (LA-H+) and un-ionised base forms are in equilibrium determined by pKa and tissue pH; only the lipid-soluble un-ionised base crosses the lipid membrane; inside the axon it re-equilibrates, and the ionised form binds the inner pore of the voltage-gated sodium channel, blocking sodium entry</title>
<rect x="1" y="1" width="898" height="428" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
<defs><marker id="la-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3A2D25"/></marker>
<marker id="la-arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D2491F"/></marker></defs>
<g font-family="'Plus Jakarta Sans',system-ui,sans-serif" text-anchor="middle">
<text x="40" y="38" text-anchor="start" font-size="17" font-weight="700" fill="#241B16">Local anaesthetic: ionisation and sodium channel block</text>
<text x="40" y="58" text-anchor="start" font-size="12" fill="#7C7068">Only the un-ionised base crosses the membrane; the ionised form blocks the channel from inside</text>
<text x="50" y="100" text-anchor="start" font-size="12" font-weight="700" fill="#7C7068">EXTRACELLULAR (tissue pH)</text>
<rect x="50" y="116" width="200" height="60" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="150" y="141" font-size="14" font-weight="700" fill="#241B16">LA-H&#8314;</text>
<text x="150" y="160" font-size="11.5" fill="#7C7068">ionised (water-soluble)</text>
<rect x="340" y="116" width="200" height="60" rx="12" fill="#F9D3C4" stroke="#D2491F" stroke-width="1.5"/>
<text x="440" y="141" font-size="14" font-weight="700" fill="#241B16">LA base</text>
<text x="440" y="160" font-size="11.5" fill="#7C7068">un-ionised (lipid-soluble)</text>
<line x1="254" y1="136" x2="336" y2="136" stroke="#3A2D25" stroke-width="2" marker-end="url(#la-arrow)"/>
<line x1="336" y1="156" x2="254" y2="156" stroke="#3A2D25" stroke-width="2" marker-end="url(#la-arrow)"/>
<rect x="30" y="210" width="840" height="36" fill="#FDE9C4" stroke="#B4671F" stroke-width="1.5"/>
<text x="150" y="233" font-size="12.5" font-weight="700" fill="#241B16">Lipid cell membrane</text>
<rect x="640" y="206" width="90" height="44" rx="6" fill="#FFFFFF" stroke="#D2491F" stroke-width="2"/>
<text x="685" y="233" font-size="12" font-weight="700" fill="#D2491F">Na&#8314; channel</text>
<line x1="440" y1="178" x2="440" y2="290" stroke="#D2491F" stroke-width="3" marker-end="url(#la-arrow-r)"/>
<text x="458" y="200" text-anchor="start" font-size="11.5" font-weight="700" fill="#D2491F">Diffuses across</text>
<text x="50" y="278" text-anchor="start" font-size="12" font-weight="700" fill="#7C7068">INTRACELLULAR (axoplasm)</text>
<rect x="340" y="294" width="200" height="60" rx="12" fill="#F9D3C4" stroke="#D2491F" stroke-width="1.5"/>
<text x="440" y="319" font-size="14" font-weight="700" fill="#241B16">LA base</text>
<text x="440" y="338" font-size="11.5" fill="#7C7068">re-equilibrates</text>
<rect x="50" y="294" width="200" height="60" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="150" y="319" font-size="14" font-weight="700" fill="#241B16">LA-H&#8314;</text>
<text x="150" y="338" font-size="11.5" fill="#7C7068">active, ionised form</text>
<line x1="336" y1="314" x2="254" y2="314" stroke="#3A2D25" stroke-width="2" marker-end="url(#la-arrow)"/>
<line x1="254" y1="334" x2="336" y2="334" stroke="#3A2D25" stroke-width="2" marker-end="url(#la-arrow)"/>
<path d="M250 324 C 300 394, 600 394, 668 254" fill="none" stroke="#D2491F" stroke-width="2.5" marker-end="url(#la-arrow-r)"/>
<text x="470" y="402" font-size="12" font-weight="700" fill="#D2491F">Binds inner pore of open/inactivated Na&#8314; channel: block</text>
<text x="800" y="140" font-size="11.5" fill="#3A2D25">Lower pKa &#8594; more base</text>
<text x="800" y="157" font-size="11.5" fill="#3A2D25">at pH 7.4 &#8594; faster onset</text>
<text x="800" y="182" font-size="11.5" fill="#3A2D25">Acidic tissue &#8594; less base</text>
<text x="800" y="199" font-size="11.5" fill="#3A2D25">&#8594; slower, weaker block</text>
</g>
</svg>
