<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="epi-title">
<title id="epi-title">Structures crossed by a needle on a midline lumbar approach to the epidural space, in order from superficial to deep: skin, subcutaneous fat, supraspinous ligament, interspinous ligament, ligamentum flavum, epidural space and dura mater, with loss of resistance at the junction of the ligamentum flavum and the epidural space</title>
<rect x="1" y="1" width="898" height="358" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
<defs><marker id="ep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3A2D25"/></marker></defs>
<g font-family="'Plus Jakarta Sans',system-ui,sans-serif" text-anchor="middle">
<text x="40" y="38" text-anchor="start" font-size="17" font-weight="700" fill="#241B16">Midline lumbar epidural: layers crossed</text>
<text x="40" y="58" text-anchor="start" font-size="12" fill="#7C7068">Superficial (left) to deep (right)</text>
<rect x="60" y="130" width="110" height="130" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<rect x="170" y="130" width="110" height="130" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
<rect x="280" y="130" width="110" height="130" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<rect x="390" y="130" width="110" height="130" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
<rect x="500" y="130" width="110" height="130" fill="#F9D3C4" stroke="#D2491F" stroke-width="1.5"/>
<rect x="610" y="130" width="110" height="130" fill="#FDE9C4" stroke="#B4671F" stroke-width="1.5"/>
<rect x="720" y="130" width="110" height="130" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<g font-size="13" font-weight="700" fill="#241B16">
<text x="115" y="190">Skin</text><text x="225" y="190">Subcut.</text><text x="225" y="206">fat</text>
<text x="335" y="190">Supraspinous</text><text x="335" y="206">ligament</text>
<text x="445" y="190">Interspinous</text><text x="445" y="206">ligament</text>
<text x="555" y="190">Ligamentum</text><text x="555" y="206">flavum</text>
<text x="665" y="190">Epidural</text><text x="665" y="206">space</text>
<text x="775" y="190">Dura</text><text x="775" y="206">mater</text>
</g>
<g font-size="11" fill="#7C7068">
<text x="115" y="284">1</text><text x="225" y="284">2</text><text x="335" y="284">3</text><text x="445" y="284">4</text><text x="555" y="284">5</text><text x="665" y="284">6</text><text x="775" y="284">7</text>
</g>
<line x1="30" y1="110" x2="640" y2="110" stroke="#3A2D25" stroke-width="3" marker-end="url(#ep-arrow)"/>
<text x="335" y="102" font-size="12" font-weight="700" fill="#3A2D25">Needle</text>
<line x1="610" y1="120" x2="610" y2="300" stroke="#D2491F" stroke-width="2" stroke-dasharray="5 4"/>
<text x="610" y="324" font-size="12.5" font-weight="700" fill="#D2491F">Loss of resistance</text>
<text x="610" y="342" font-size="11" fill="#7C7068">as the needle leaves the ligamentum flavum</text>
</g>
</svg>
