<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="c3c6-title">
<title id="c3c6-title">The morphinan skeleton — hydroxyl groups at the C3 and C6 positions determine opioid-induced immunosuppression; C6 modification (oxycodone, hydromorphone, tramadol) abolishes the effect, C3 modification alone (codeine, dihydrocodeine) only reduces it</title>

<rect x="1" y="1" width="998" height="558" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>

<g font-family="'Plus Jakarta Sans',system-ui,sans-serif">

  <text x="500" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#241B16">Opioid structure and immunosuppressive potential</text>
  <text x="500" y="64" text-anchor="middle" font-size="13" fill="#7C7068">Hydroxyl substitution at C3 and C6 of the morphinan skeleton governs the degree of immune effect</text>

  <!-- three fused rings (A, B, C) -->
  <g stroke="#C9B7A6" stroke-width="2.5" fill="#FBEFE4">
    <polygon points="220,230 290,190 360,230 360,300 290,340 220,300"/>
    <polygon points="360,230 430,190 500,230 500,300 430,340 360,300"/>
    <polygon points="500,230 570,190 640,230 640,300 570,340 500,300"/>
  </g>
  <text x="290" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#8A5A3C">A</text>
  <text x="430" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#8A5A3C">B</text>
  <text x="570" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#8A5A3C">C</text>

  <!-- C3 hydroxyl marker (left ring) -->
  <circle cx="220" cy="300" r="9" fill="#F0623C"/>
  <line x1="220" y1="300" x2="160" y2="360" stroke="#F0623C" stroke-width="2.5"/>
  <text x="150" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#D2491F">C3&#8211;OH</text>

  <!-- C6 hydroxyl marker (right ring) -->
  <circle cx="640" cy="300" r="9" fill="#F5A524"/>
  <line x1="640" y1="300" x2="700" y2="360" stroke="#F5A524" stroke-width="2.5"/>
  <text x="712" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#B4671F">C6&#8211;OH</text>

  <text x="290" y="164" text-anchor="middle" font-size="12" fill="#7C7068">phenanthrene nucleus</text>

  <!-- callout boxes -->
  <rect x="60" y="410" width="380" height="120" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
  <text x="80" y="436" font-size="13" font-weight="700" fill="#D2491F">C3 hydroxyl modification</text>
  <text x="80" y="458" font-size="12.5" fill="#3A2D25">Reduces &#8212; but does not abolish &#8212;</text>
  <text x="80" y="476" font-size="12.5" fill="#3A2D25">immunosuppression</text>
  <text x="80" y="500" font-size="12" font-style="italic" fill="#7C7068">e.g. codeine, dihydrocodeine</text>

  <rect x="560" y="410" width="380" height="120" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
  <text x="580" y="436" font-size="13" font-weight="700" fill="#B4671F">C6 hydroxyl modification</text>
  <text x="580" y="458" font-size="12.5" fill="#3A2D25">Abolishes immunosuppression</text>
  <text x="580" y="500" font-size="12" font-style="italic" fill="#7C7068">e.g. oxycodone, hydromorphone, tramadol</text>

  <line x1="220" y1="309" x2="158" y2="412" stroke="#F0623C" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="640" y1="309" x2="712" y2="412" stroke="#F5A524" stroke-width="1.5" stroke-dasharray="2 4"/>

  <text x="500" y="112" text-anchor="middle" font-size="12" fill="#7C7068">High receptor affinity + hydroxyl at both C3 and C6 (e.g. morphine) &#8594; most immunosuppressive</text>

</g>
</svg>
