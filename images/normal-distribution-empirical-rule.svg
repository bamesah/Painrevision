<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="empirical-rule-title">
<title id="empirical-rule-title">The empirical (68-95-99.7) rule for a normal distribution, showing the percentage of data within 1, 2 and 3 standard deviations of the mean</title>

<rect x="1" y="1" width="898" height="478" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>

<g font-family="'Plus Jakarta Sans',system-ui,sans-serif">

  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#241B16">The empirical rule (68&#8211;95&#8211;99.7%)</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#7C7068">Percentage of data lying within each band of standard deviations (SD) from the mean (&#956;) &#8212; normal distribution only</text>

  <!-- bell curve -->
  <path d="M90,300 C140,298 170,270 200,220 C240,150 300,90 460,80 C620,90 680,150 720,220 C750,270 780,298 830,300 Z" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>

  <!-- baseline -->
  <line x1="60" y1="300" x2="860" y2="300" stroke="#3A2D25" stroke-width="1.5"/>

  <!-- SD tick lines -->
  <g stroke="#B98C6A" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="130" y1="300" x2="130" y2="296"/>
    <line x1="240" y1="300" x2="240" y2="275"/>
    <line x1="350" y1="300" x2="350" y2="200"/>
    <line x1="570" y1="300" x2="570" y2="200"/>
    <line x1="680" y1="300" x2="680" y2="275"/>
    <line x1="790" y1="300" x2="790" y2="296"/>
  </g>
  <line x1="460" y1="300" x2="460" y2="80" stroke="#241B16" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- tick labels -->
  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#7C7068" text-anchor="middle">
    <text x="130" y="317">&#8722;3&#963;</text>
    <text x="240" y="317">&#8722;2&#963;</text>
    <text x="350" y="317">&#8722;1&#963;</text>
    <text x="460" y="317" font-weight="700" fill="#241B16">&#956;</text>
    <text x="570" y="317">+1&#963;</text>
    <text x="680" y="317">+2&#963;</text>
    <text x="790" y="317">+3&#963;</text>
  </g>

  <!-- 68% bracket -->
  <g stroke="#F0623C" stroke-width="2.5">
    <line x1="350" y1="352" x2="570" y2="352"/>
    <line x1="350" y1="345" x2="350" y2="359"/>
    <line x1="570" y1="345" x2="570" y2="359"/>
  </g>
  <text x="460" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#D2491F">~68% within &#177;1 SD</text>

  <!-- 95% bracket -->
  <g stroke="#F5A524" stroke-width="2.5">
    <line x1="240" y1="392" x2="680" y2="392"/>
    <line x1="240" y1="385" x2="240" y2="399"/>
    <line x1="680" y1="385" x2="680" y2="399"/>
  </g>
  <text x="460" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#B8790E">~95% within &#177;2 SD</text>

  <!-- 99.7% bracket -->
  <g stroke="#7C7068" stroke-width="2.5">
    <line x1="130" y1="432" x2="790" y2="432"/>
    <line x1="130" y1="425" x2="130" y2="439"/>
    <line x1="790" y1="425" x2="790" y2="439"/>
  </g>
  <text x="460" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#5C534C">~99.7% within &#177;3 SD</text>

  <text x="460" y="463" text-anchor="middle" font-size="11.5" font-style="italic" fill="#A99E95">Mean = median = mode at &#956;, the centre of the curve</text>

</g>
</svg>
