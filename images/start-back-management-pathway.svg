<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="sbp-title">
<title id="sbp-title">STarT Back stratified management pathway: low risk (total score 3 or less) — self-management and exercise; medium risk (total 4 or more, psychosocial subscale 3 or less) — structured physiotherapy; high risk (total 4 or more, psychosocial subscale 4 or more) — combined physical and psychological programme</title>

<rect x="1" y="1" width="998" height="358" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>

<g font-family="'Plus Jakarta Sans',system-ui,sans-serif">

  <text x="34" y="42" font-size="16" font-weight="800" fill="#241B16">STarT Back — stratified management pathway</text>
  <text x="34" y="64" font-size="12.5" fill="#7C7068">Match the intensity of treatment to the prognostic risk group at first presentation.</text>

  <!-- LOW -->
  <rect x="30" y="88" width="300" height="240" rx="13" fill="#E9F3EC" stroke="#A9CDB4" stroke-width="1.5"/>
  <text x="50" y="120" font-size="14" font-weight="800" fill="#2E7D48">LOW RISK</text>
  <text x="50" y="142" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10.5" font-weight="600" fill="#2E7D48">TOTAL SCORE &#8804; 3</text>
  <line x1="50" y1="156" x2="310" y2="156" stroke="#A9CDB4" stroke-width="1"/>
  <text x="50" y="182" font-size="13" fill="#3A2D25"><tspan x="50" dy="0">Reassurance that most episodes</tspan><tspan x="50" dy="18">settle. Self-management advice</tspan><tspan x="50" dy="18">and encouragement to stay</tspan><tspan x="50" dy="18">active; a single physiotherapy</tspan><tspan x="50" dy="18">session if needed.</tspan><tspan x="50" dy="18" font-weight="600" fill="#241B16">No routine specialist referral.</tspan></text>

  <!-- MEDIUM -->
  <rect x="350" y="88" width="300" height="240" rx="13" fill="#FDF3E2" stroke="#EBC98A" stroke-width="1.5"/>
  <text x="370" y="120" font-size="14" font-weight="800" fill="#7A5200">MEDIUM RISK</text>
  <text x="370" y="142" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10.5" font-weight="600" fill="#7A5200">TOTAL &#8805; 4 &#183; PSYCHOSOCIAL &#8804; 3</text>
  <line x1="370" y1="156" x2="630" y2="156" stroke="#EBC98A" stroke-width="1"/>
  <text x="370" y="182" font-size="13" fill="#3A2D25"><tspan x="370" dy="0">Structured physical treatment</tspan><tspan x="370" dy="18">— primary-care physiotherapy</tspan><tspan x="370" dy="18">targeting physical obstacles to</tspan><tspan x="370" dy="18">recovery (function, movement,</tspan><tspan x="370" dy="18">graded activity).</tspan></text>

  <!-- HIGH -->
  <rect x="670" y="88" width="300" height="240" rx="13" fill="#FBEBE9" stroke="#E3ABA3" stroke-width="1.5"/>
  <text x="690" y="120" font-size="14" font-weight="800" fill="#C0392B">HIGH RISK</text>
  <text x="690" y="142" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10.5" font-weight="600" fill="#C0392B">TOTAL &#8805; 4 &#183; PSYCHOSOCIAL &#8805; 4</text>
  <line x1="690" y1="156" x2="950" y2="156" stroke="#E3ABA3" stroke-width="1"/>
  <text x="690" y="182" font-size="13" fill="#3A2D25"><tspan x="690" dy="0">Combined physical <tspan font-weight="700">and</tspan></tspan><tspan x="690" dy="18">psychological programme (e.g.</tspan><tspan x="690" dy="18">a pain management programme)</tspan><tspan x="690" dy="18">addressing psychosocial</tspan><tspan x="690" dy="18">factors — fear-avoidance,</tspan><tspan x="690" dy="18">catastrophising, low mood.</tspan></text>

</g>
</svg>
