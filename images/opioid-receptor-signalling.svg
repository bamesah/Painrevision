<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="ors-title">
<title id="ors-title">Opioid receptor signalling: an agonist binds a Gi/Go-coupled opioid receptor; the G-alpha subunit inhibits adenylyl cyclase and lowers cAMP; the G beta-gamma subunit inhibits presynaptic N-type calcium channels, reducing neurotransmitter release, and opens postsynaptic GIRK potassium channels, causing hyperpolarisation; together these reduce nociceptive transmission; receptor phosphorylation and beta-arrestin binding cause desensitisation and internalisation</title>
<rect x="1" y="1" width="898" height="468" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
<defs><marker id="or-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3A2D25"/></marker></defs>
<g font-family="'Plus Jakarta Sans',system-ui,sans-serif" text-anchor="middle">
<text x="40" y="38" text-anchor="start" font-size="17" font-weight="700" fill="#241B16">Opioid receptor signalling</text>
<text x="40" y="58" text-anchor="start" font-size="12" fill="#7C7068">All classical opioid receptors (&#956;, &#948;, &#954;) are Gi/Go-coupled G protein-coupled receptors</text>
<rect x="60" y="80" width="260" height="56" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="190" y="104" font-size="14" font-weight="700" fill="#241B16">Opioid agonist</text>
<text x="190" y="123" font-size="11.5" fill="#7C7068">endogenous peptide or drug</text>
<rect x="480" y="80" width="360" height="56" rx="12" fill="#F9D3C4" stroke="#D2491F" stroke-width="1.5"/>
<text x="660" y="104" font-size="14" font-weight="700" fill="#241B16">Opioid receptor (Gi/Go GPCR)</text>
<text x="660" y="123" font-size="11.5" fill="#7C7068">G&#945;i/o dissociates from G&#946;&#947;</text>
<line x1="320" y1="108" x2="478" y2="108" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#or-arrow)"/>
<line x1="660" y1="136" x2="660" y2="170" stroke="#3A2D25" stroke-width="2"/>
<line x1="150" y1="170" x2="750" y2="170" stroke="#3A2D25" stroke-width="2"/>
<line x1="150" y1="170" x2="150" y2="198" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#or-arrow)"/>
<line x1="450" y1="170" x2="450" y2="198" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#or-arrow)"/>
<line x1="750" y1="170" x2="750" y2="198" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#or-arrow)"/>
<rect x="40" y="200" width="220" height="116" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="150" y="224" font-size="13" font-weight="700" fill="#241B16">G&#945;i/o</text>
<text x="150" y="246" font-size="11.5" fill="#3A2D25">Inhibits adenylyl cyclase</text>
<text x="150" y="264" font-size="11.5" fill="#3A2D25">&#8595; cAMP, &#8595; PKA activity</text>
<text x="150" y="288" font-size="11" fill="#7C7068">Reduced excitability and</text>
<text x="150" y="303" font-size="11" fill="#7C7068">gene-transcription effects</text>
<rect x="340" y="200" width="220" height="116" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="450" y="224" font-size="13" font-weight="700" fill="#241B16">G&#946;&#947; (presynaptic)</text>
<text x="450" y="246" font-size="11.5" fill="#3A2D25">Inhibits N-type Ca&#178;&#8314; channels</text>
<text x="450" y="264" font-size="11.5" fill="#3A2D25">&#8595; Ca&#178;&#8314; entry</text>
<text x="450" y="288" font-size="11" fill="#7C7068">&#8595; release of substance P,</text>
<text x="450" y="303" font-size="11" fill="#7C7068">glutamate and CGRP</text>
<rect x="640" y="200" width="220" height="116" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="750" y="224" font-size="13" font-weight="700" fill="#241B16">G&#946;&#947; (postsynaptic)</text>
<text x="750" y="246" font-size="11.5" fill="#3A2D25">Opens GIRK K&#8314; channels</text>
<text x="750" y="264" font-size="11.5" fill="#3A2D25">K&#8314; efflux</text>
<text x="750" y="288" font-size="11" fill="#7C7068">Hyperpolarisation: neurone</text>
<text x="750" y="303" font-size="11" fill="#7C7068">less likely to fire</text>
<line x1="150" y1="316" x2="150" y2="340" stroke="#3A2D25" stroke-width="2"/>
<line x1="450" y1="316" x2="450" y2="340" stroke="#3A2D25" stroke-width="2"/>
<line x1="750" y1="316" x2="750" y2="340" stroke="#3A2D25" stroke-width="2"/>
<line x1="150" y1="340" x2="750" y2="340" stroke="#3A2D25" stroke-width="2"/>
<line x1="450" y1="340" x2="450" y2="360" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#or-arrow)"/>
<rect x="290" y="362" width="320" height="44" rx="12" fill="#F0623C" stroke="#D2491F" stroke-width="1.5"/>
<text x="450" y="390" font-size="14" font-weight="700" fill="#FFFFFF">Reduced nociceptive transmission</text>
<text x="450" y="436" font-size="11.5" fill="#7C7068">Prolonged exposure: GRK phosphorylation &#8594; &#946;-arrestin binding &#8594; desensitisation and receptor internalisation (tolerance)</text>
</g>
</svg>
