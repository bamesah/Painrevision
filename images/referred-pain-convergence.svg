<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="rpc-title">
<title id="rpc-title">Convergence-projection theory of referred pain: visceral afferents from an organ such as the heart and somatic afferents from the corresponding skin dermatome converge on the same second-order neurone in the dorsal horn at the same spinal segment; the spinothalamic tract carries the signal to the thalamus and cortex, which interprets it as arising from the more familiar somatic site</title>
<rect x="1" y="1" width="898" height="378" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
<defs><marker id="rp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3A2D25"/></marker></defs>
<g font-family="'Plus Jakarta Sans',system-ui,sans-serif" text-anchor="middle">
<text x="40" y="38" text-anchor="start" font-size="17" font-weight="700" fill="#241B16">Convergence-projection theory of referred pain</text>
<text x="40" y="58" text-anchor="start" font-size="12" fill="#7C7068">Example: myocardial ischaemia felt in the left arm and jaw (T1&#8211;T4 segments)</text>
<rect x="40" y="90" width="210" height="64" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="145" y="116" font-size="14" font-weight="700" fill="#241B16">Viscus (heart)</text>
<text x="145" y="136" font-size="11.5" fill="#7C7068">Visceral nociceptive afferent</text>
<rect x="40" y="226" width="210" height="64" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="145" y="252" font-size="14" font-weight="700" fill="#241B16">Skin (left arm)</text>
<text x="145" y="272" font-size="11.5" fill="#7C7068">Somatic afferent, same segment</text>
<circle cx="480" cy="190" r="56" fill="#F9D3C4" stroke="#D2491F" stroke-width="1.5"/>
<text x="480" y="181" font-size="13" font-weight="700" fill="#241B16">Second-order</text>
<text x="480" y="198" font-size="13" font-weight="700" fill="#241B16">neurone</text>
<text x="480" y="216" font-size="11" fill="#7C7068">dorsal horn</text>
<line x1="250" y1="122" x2="430" y2="166" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#rp-arrow)"/>
<line x1="250" y1="258" x2="430" y2="214" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#rp-arrow)"/>
<text x="330" y="125" font-size="11.5" fill="#7C7068">convergence</text>
<rect x="680" y="150" width="190" height="80" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="775" y="176" font-size="13" font-weight="700" fill="#241B16">Spinothalamic tract</text>
<text x="775" y="196" font-size="11.5" fill="#7C7068">&#8594; thalamus &#8594; cortex</text>
<text x="775" y="214" font-size="11.5" fill="#7C7068">pain perceived in the skin</text>
<line x1="536" y1="190" x2="678" y2="190" stroke="#D2491F" stroke-width="3" marker-end="url(#rp-arrow)"/>
<text x="607" y="180" font-size="11.5" font-weight="700" fill="#D2491F">projection</text>
<text x="450" y="340" font-size="12.5" fill="#3A2D25">The brain cannot tell the two inputs apart, and interprets the signal as arising from the</text>
<text x="450" y="358" font-size="12.5" fill="#3A2D25">more familiar somatic site. Visceral input is far sparser than somatic input.</text>
</g>
</svg>
