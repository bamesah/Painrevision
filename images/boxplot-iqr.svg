<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="boxplot-title">
<title id="boxplot-title">A box-and-whisker plot for a positively skewed distribution, showing the minimum, Q1, median (Q2), Q3, maximum, the interquartile range, and an outlier</title>

<rect x="1" y="1" width="898" height="398" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>

<g font-family="'Plus Jakarta Sans',system-ui,sans-serif">

  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#241B16">Box-and-whisker plot for a positively skewed distribution</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#7C7068">Quartiles, the interquartile range (IQR), whiskers (&#177;1.5&#215;IQR) and an outlier</text>

  <!-- skewed curve on top, aligned to the boxplot beneath -->
  <path d="M40,175 C90,172 140,160 180,130 C220,98 240,78 260,76 C300,80 340,110 400,150 C480,190 600,195 860,196 Z" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
  <line x1="40" y1="196" x2="860" y2="196" stroke="#3A2D25" stroke-width="1.5"/>

  <!-- guide lines from curve down to boxplot -->
  <g stroke="#B98C6A" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="290" y1="76" x2="290" y2="320"/>
    <line x1="360" y1="76" x2="360" y2="320"/>
    <line x1="470" y1="76" x2="470" y2="320"/>
  </g>

  <!-- IQR bracket -->
  <g stroke="#F0623C" stroke-width="2.5">
    <line x1="290" y1="252" x2="470" y2="252"/>
    <line x1="290" y1="245" x2="290" y2="259"/>
    <line x1="470" y1="245" x2="470" y2="259"/>
  </g>
  <text x="380" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#D2491F">IQR = Q3 &#8722; Q1</text>

  <!-- whiskers -->
  <line x1="200" y1="300" x2="290" y2="300" stroke="#3A2D25" stroke-width="2"/>
  <line x1="200" y1="288" x2="200" y2="312" stroke="#3A2D25" stroke-width="2"/>
  <line x1="470" y1="300" x2="620" y2="300" stroke="#3A2D25" stroke-width="2"/>
  <line x1="620" y1="288" x2="620" y2="312" stroke="#3A2D25" stroke-width="2"/>

  <!-- box -->
  <rect x="290" y="280" width="180" height="40" fill="#FBD9CC" stroke="#241B16" stroke-width="1.5"/>
  <line x1="360" y1="280" x2="360" y2="320" stroke="#D2491F" stroke-width="3"/>

  <!-- outlier -->
  <circle cx="790" cy="300" r="6" fill="#F0623C" stroke="#241B16" stroke-width="1.5"/>

  <!-- labels beneath -->
  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#7C7068" text-anchor="middle">
    <text x="200" y="345">Min</text>
    <text x="290" y="345">Q1</text>
    <text x="360" y="345" font-weight="700" fill="#D2491F">Median (Q2)</text>
    <text x="470" y="345">Q3</text>
    <text x="620" y="345">Max</text>
    <text x="790" y="345">Outlier</text>
  </g>

  <text x="450" y="378" text-anchor="middle" font-size="11.5" font-style="italic" fill="#A99E95">Whiskers extend to the most extreme value within 1.5&#215;IQR of the box; points beyond this are plotted as outliers</text>

</g>
</svg>
