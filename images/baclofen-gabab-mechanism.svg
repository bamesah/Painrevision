<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="baclofen-title">
<title id="baclofen-title">Baclofen acts at presynaptic GABA-B receptors to reduce calcium influx and excitatory neurotransmitter release, and at postsynaptic GABA-B receptors to open potassium channels and hyperpolarise the neurone</title>

<rect x="1" y="1" width="998" height="628" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>

<defs>
  <marker id="bac-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3A2D25"/>
  </marker>
  <marker id="bac-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#D2491F"/>
  </marker>
</defs>

<g font-family="'Plus Jakarta Sans',system-ui,sans-serif">

  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#241B16">Baclofen: GABA-B receptor agonism at the spinal cord</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#7C7068">Acts both presynaptically and postsynaptically</text>

  <!-- ===== Presynaptic terminal ===== -->
  <rect x="120" y="76" width="760" height="196" rx="24" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
  <rect x="120" y="262" width="760" height="10" fill="#F7E4DA"/>
  <line x1="120" y1="272" x2="880" y2="272" stroke="#D2491F" stroke-width="2"/>
  <text x="146" y="104" font-size="12" font-weight="700" letter-spacing="1" fill="#D2491F">PRESYNAPTIC TERMINAL</text>
  <text x="146" y="121" font-size="11" fill="#7C7068">primary afferent</text>

  <!-- presynaptic cascade -->
  <rect x="160" y="212" width="130" height="46" rx="10" fill="#FFFFFF" stroke="#D2491F" stroke-width="2.5"/>
  <text x="225" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#D2491F">GABA-B</text>
  <text x="225" y="249" text-anchor="middle" font-size="10.5" fill="#3A2D25">receptor</text>

  <rect x="330" y="212" width="110" height="46" rx="10" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
  <text x="385" y="232" text-anchor="middle" font-size="12.5" font-weight="700" fill="#241B16">Gi/o</text>
  <text x="385" y="249" text-anchor="middle" font-size="10.5" fill="#3A2D25">protein</text>

  <rect x="480" y="212" width="170" height="46" rx="10" fill="#FFFFFF" stroke="#3A2D25" stroke-width="1.5"/>
  <text x="565" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#241B16">Voltage-gated Ca&#178;&#8314;</text>
  <text x="565" y="249" text-anchor="middle" font-size="10.5" fill="#3A2D25">channel inhibited</text>

  <g stroke="#3A2D25" stroke-width="2" fill="none" marker-end="url(#bac-arrow)">
    <path d="M290 235 L326 235"/>
    <path d="M440 235 L476 235"/>
    <path d="M565 212 L565 180"/>
  </g>

  <rect x="440" y="120" width="250" height="56" rx="12" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
  <text x="565" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#241B16">&#8595; Ca&#178;&#8314; influx</text>
  <text x="565" y="162" text-anchor="middle" font-size="11" fill="#3A2D25">&#8594; &#8595; vesicle exocytosis</text>

  <!-- vesicles -->
  <g fill="#FFFFFF" stroke="#D2491F" stroke-width="1.5">
    <circle cx="760" cy="150" r="14"/>
    <circle cx="800" cy="170" r="14"/>
    <circle cx="750" cy="192" r="14"/>
    <circle cx="795" cy="212" r="14"/>
    <circle cx="840" cy="192" r="14"/>
  </g>
  <g fill="#F0623C">
    <circle cx="757" cy="147" r="2.5"/><circle cx="764" cy="153" r="2.5"/>
    <circle cx="797" cy="167" r="2.5"/><circle cx="804" cy="173" r="2.5"/>
    <circle cx="747" cy="189" r="2.5"/><circle cx="754" cy="195" r="2.5"/>
    <circle cx="792" cy="209" r="2.5"/><circle cx="799" cy="215" r="2.5"/>
    <circle cx="837" cy="189" r="2.5"/><circle cx="844" cy="195" r="2.5"/>
  </g>
  <text x="795" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#241B16">Excitatory vesicles</text>
  <text x="795" y="126" text-anchor="middle" font-size="10" fill="#7C7068">glutamate, aspartate, SP</text>
  <path d="M690 148 L732 150" stroke="#3A2D25" stroke-width="2" fill="none" marker-end="url(#bac-arrow)"/>

  <!-- ===== Synaptic cleft ===== -->
  <text x="132" y="316" font-size="10.5" letter-spacing="1" fill="#A99E95">SYNAPTIC CLEFT</text>

  <g fill="#F0623C" stroke="#D2491F" stroke-width="1">
    <polygon points="235,300 244,309 235,318 226,309"/>
    <polygon points="262,316 271,325 262,334 253,325"/>
  </g>
  <text x="285" y="322" font-size="12.5" font-weight="700" fill="#D2491F">Baclofen</text>
  <g stroke="#D2491F" stroke-width="2" fill="none" marker-end="url(#bac-arrow-coral)">
    <path d="M232 298 L228 262"/>
    <path d="M258 336 L240 354"/>
  </g>

  <!-- reduced release into cleft -->
  <path d="M795 272 L795 318" stroke="#A99E95" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#bac-arrow)"/>
  <text x="784" y="300" text-anchor="end" font-size="11" font-weight="700" fill="#3A2D25">&#8595; transmitter</text>
  <text x="784" y="314" text-anchor="end" font-size="11" font-weight="700" fill="#3A2D25">in cleft</text>

  <!-- ===== Postsynaptic neurone ===== -->
  <rect x="120" y="354" width="760" height="170" rx="24" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
  <rect x="120" y="354" width="760" height="10" fill="#F7E4DA"/>
  <line x1="120" y1="354" x2="880" y2="354" stroke="#D2491F" stroke-width="2"/>
  <text x="854" y="392" text-anchor="end" font-size="12" font-weight="700" letter-spacing="1" fill="#D2491F">POSTSYNAPTIC NEURONE</text>
  <text x="854" y="409" text-anchor="end" font-size="11" fill="#7C7068">e.g. motor / dorsal horn neurone</text>

  <rect x="160" y="370" width="130" height="46" rx="10" fill="#FFFFFF" stroke="#D2491F" stroke-width="2.5"/>
  <text x="225" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#D2491F">GABA-B</text>
  <text x="225" y="407" text-anchor="middle" font-size="10.5" fill="#3A2D25">receptor</text>

  <rect x="330" y="370" width="110" height="46" rx="10" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
  <text x="385" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#241B16">Gi/o</text>
  <text x="385" y="407" text-anchor="middle" font-size="10.5" fill="#3A2D25">protein</text>

  <rect x="480" y="370" width="170" height="46" rx="10" fill="#FFFFFF" stroke="#3A2D25" stroke-width="1.5"/>
  <text x="565" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#241B16">K&#8314; channel opens</text>
  <text x="565" y="407" text-anchor="middle" font-size="10.5" fill="#3A2D25">(GIRK)</text>

  <g stroke="#3A2D25" stroke-width="2" fill="none" marker-end="url(#bac-arrow)">
    <path d="M290 393 L326 393"/>
    <path d="M440 393 L476 393"/>
    <path d="M565 416 L565 444"/>
  </g>
  <path d="M640 370 L640 330" stroke="#3A2D25" stroke-width="2" fill="none" marker-end="url(#bac-arrow)"/>
  <text x="652" y="336" font-size="11.5" font-weight="700" fill="#3A2D25">K&#8314; efflux</text>

  <rect x="430" y="448" width="270" height="56" rx="12" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
  <text x="565" y="471" text-anchor="middle" font-size="13" font-weight="700" fill="#241B16">Hyperpolarisation</text>
  <text x="565" y="490" text-anchor="middle" font-size="11" fill="#3A2D25">&#8595; neuronal excitability</text>

  <!-- ===== Net effect ===== -->
  <rect x="120" y="548" width="760" height="58" rx="12" fill="#FFFFFF" stroke="#D2491F" stroke-width="2"/>
  <text x="500" y="572" text-anchor="middle" font-size="13.5" font-weight="700" fill="#D2491F">Net effect: &#8595; excitatory transmission at the spinal cord level</text>
  <text x="500" y="592" text-anchor="middle" font-size="11.5" fill="#3A2D25">&#8594; muscle relaxation, reduced spasticity, and some analgesic effect</text>

</g>
</svg>
