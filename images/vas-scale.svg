<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-labelledby="vas-title">
<title id="vas-title">Visual Analogue Scale — a 10cm line anchored from no pain to worst pain imaginable</title>

<!-- minor ticks (1cm graduations) -->
<g stroke="#D8C9B8" stroke-width="1.5">
  <line x1="96" y1="53" x2="96" y2="67"/>
  <line x1="152" y1="53" x2="152" y2="67"/>
  <line x1="208" y1="53" x2="208" y2="67"/>
  <line x1="264" y1="53" x2="264" y2="67"/>
  <line x1="320" y1="48" x2="320" y2="72"/>
  <line x1="376" y1="53" x2="376" y2="67"/>
  <line x1="432" y1="53" x2="432" y2="67"/>
  <line x1="488" y1="53" x2="488" y2="67"/>
  <line x1="544" y1="53" x2="544" y2="67"/>
</g>

<!-- main line -->
<line x1="40" y1="60" x2="600" y2="60" stroke="#241B16" stroke-width="3" stroke-linecap="round"/>
<!-- end caps -->
<line x1="40" y1="42" x2="40" y2="78" stroke="#241B16" stroke-width="3" stroke-linecap="round"/>
<line x1="600" y1="42" x2="600" y2="78" stroke="#241B16" stroke-width="3" stroke-linecap="round"/>

<!-- 0 / 10 markers -->
<text x="40" y="34" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="600" fill="#7C7068">0</text>
<text x="600" y="34" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="600" fill="#7C7068">10</text>
<text x="320" y="30" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#A99E95">10cm / 100mm</text>

<!-- example patient mark -->
<g>
  <line x1="430" y1="46" x2="430" y2="74" stroke="#F0623C" stroke-width="2.5" stroke-dasharray="2 3"/>
  <text x="430" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-style="italic" fill="#A99E95">example patient mark</text>
</g>

<!-- anchor labels -->
<text x="40" y="126" text-anchor="start" font-family="'Plus Jakarta Sans',sans-serif" font-size="15" font-weight="600" fill="#3A2D25">No pain</text>
<text x="600" y="126" text-anchor="end" font-family="'Plus Jakarta Sans',sans-serif" font-size="15" font-weight="600" fill="#3A2D25">Worst pain imaginable</text>
</svg>
