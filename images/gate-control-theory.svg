<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="gct-title">
<title id="gct-title">Melzack and Wall gate control theory: large-diameter A-beta afferents excite the substantia gelatinosa inhibitory interneuron, which closes the gate by inhibiting the dorsal horn projection (T) neurone; small-diameter A-delta and C nociceptive afferents inhibit that interneuron and excite the T neurone, opening the gate; descending brain pathways also modulate the interneuron; the T neurone projects via the spinothalamic tract to the brain</title>
<rect x="1" y="1" width="898" height="428" rx="16" fill="#FFFFFF" stroke="#E0D3C4" stroke-width="1.5"/>
<defs>
<marker id="gc-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3A2D25"/></marker>
<marker id="gc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D2491F"/></marker>
</defs>
<g font-family="'Plus Jakarta Sans',system-ui,sans-serif" text-anchor="middle">
<text x="40" y="38" text-anchor="start" font-size="17" font-weight="700" fill="#241B16">Gate control theory (Melzack and Wall, 1965)</text>
<text x="40" y="58" text-anchor="start" font-size="12" fill="#7C7068">Solid line = excitatory (+); dashed line = inhibitory (&#8722;)</text>
<rect x="30" y="88" width="180" height="64" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="120" y="114" font-size="14" font-weight="700" fill="#241B16">A&#946; afferents</text>
<text x="120" y="134" font-size="11.5" fill="#7C7068">Large, myelinated: touch, vibration</text>
<rect x="30" y="288" width="180" height="64" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="120" y="314" font-size="14" font-weight="700" fill="#241B16">A&#948; and C afferents</text>
<text x="120" y="334" font-size="11.5" fill="#7C7068">Small: nociceptive input</text>
<rect x="320" y="372" width="200" height="40" rx="10" fill="#FDE9C4" stroke="#B4671F" stroke-width="1.5"/>
<text x="420" y="397" font-size="12.5" font-weight="700" fill="#241B16">Descending control from brain</text>
<circle cx="420" cy="220" r="50" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="420" y="216" font-size="14" font-weight="700" fill="#241B16">SG</text>
<text x="420" y="233" font-size="11" fill="#7C7068">inhibitory</text>
<text x="420" y="246" font-size="11" fill="#7C7068">interneuron</text>
<circle cx="650" cy="220" r="46" fill="#F9D3C4" stroke="#D2491F" stroke-width="1.5"/>
<text x="650" y="216" font-size="14" font-weight="700" fill="#241B16">T cell</text>
<text x="650" y="233" font-size="11" fill="#7C7068">projection</text>
<text x="650" y="246" font-size="11" fill="#7C7068">neurone</text>
<rect x="745" y="190" width="130" height="60" rx="12" fill="#FBEFE4" stroke="#E0D3C4" stroke-width="1.5"/>
<text x="810" y="215" font-size="12.5" font-weight="700" fill="#241B16">Spinothalamic</text>
<text x="810" y="232" font-size="12.5" font-weight="700" fill="#241B16">tract to brain</text>
<line x1="696" y1="220" x2="743" y2="220" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#gc-ink)"/>
<line x1="210" y1="125" x2="376" y2="195" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#gc-ink)"/>
<text x="285" y="150" font-size="17" font-weight="700" fill="#3A2D25">+</text>
<path d="M210 105 C 380 60, 600 70, 640 172" fill="none" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#gc-ink)"/>
<text x="470" y="88" font-size="17" font-weight="700" fill="#3A2D25">+</text>
<line x1="210" y1="315" x2="376" y2="245" stroke="#D2491F" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gc-red)"/>
<text x="285" y="296" font-size="20" font-weight="700" fill="#D2491F">&#8722;</text>
<path d="M210 335 C 380 380, 600 370, 640 268" fill="none" stroke="#3A2D25" stroke-width="2.5" marker-end="url(#gc-ink)"/>
<text x="580" y="352" font-size="17" font-weight="700" fill="#3A2D25">+</text>
<line x1="472" y1="220" x2="602" y2="220" stroke="#D2491F" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gc-red)"/>
<text x="537" y="210" font-size="20" font-weight="700" fill="#D2491F">&#8722;</text>
<line x1="420" y1="372" x2="420" y2="274" stroke="#B4671F" stroke-width="2.5" marker-end="url(#gc-ink)"/>
<text x="440" y="330" text-anchor="start" font-size="11" fill="#7C7068">modulates the gate</text>
<text x="760" y="320" font-size="12" font-weight="700" fill="#D2491F">A&#946; activity closes the gate</text>
<text x="760" y="338" font-size="12" font-weight="700" fill="#D2491F">(e.g. TENS, rubbing a bruise)</text>
<text x="760" y="364" font-size="12" font-weight="700" fill="#3A2D25">A&#948;/C activity opens the gate</text>
</g>
</svg>
