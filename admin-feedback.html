<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Member Feedback — PainRevision MCQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{
  --coral:#F0623C;--coral-deep:#D2491F;--coral-soft:#FBD9CC;--coral-faint:rgba(240,98,60,.08);
  --amber:#F5A524;--amber-soft:#FCE6BF;
  --ink:#241B16;--ink-soft:#3A2D25;
  --stone:#7C7068;--stone-light:#A99E95;
  --cream:#FBF5EE;--surface:#FFFFFF;--surface-warm:#FFFAF4;
  --border:#EDE3D7;--border-strong:#E0D3C4;
  --wrong:#C0392B;
  --shadow-sm:0 1px 2px rgba(36,27,22,.05),0 8px 20px -14px rgba(36,27,22,.18);
  --shadow:0 1px 2px rgba(36,27,22,.04),0 18px 40px -22px rgba(36,27,22,.22);
  --san:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--san);background:var(--cream);color:var(--ink);line-height:1.5;overflow-x:hidden;min-height:100vh}
::selection{background:var(--coral);color:#fff}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:var(--san)}

/* ===== TOPBAR ===== */
.topbar{background:var(--ink);padding:0 32px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:90}
.topbar-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.03em;color:#fff}
.topbar-logo svg{width:28px;height:28px;--mark-stroke:#F0623C;--mark-dot:#F5A524}
.topbar-logo .rev{color:var(--amber)}
.topbar-badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;background:rgba(240,98,60,.25);color:var(--coral-soft);border:1px solid rgba(240,98,60,.3);padding:3px 10px;border-radius:999px}
.topbar-nav{display:flex;gap:2px;margin-left:12px}
.topbar-nav a{font-size:13px;font-weight:600;color:rgba(255,255,255,.55);padding:7px 12px;border-radius:8px;transition:color .16s,background .16s}
.topbar-nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.topbar-nav a.active{color:#fff;background:rgba(255,255,255,.12)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-user{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.6)}
.tb-btn{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid transparent;background:transparent;color:rgba(255,255,255,.55);transition:color .16s,background .16s}
.tb-btn:hover{color:#fff;background:rgba(255,255,255,.08)}

/* ===== SHELL ===== */
.wrap{max-width:860px;margin:0 auto;padding:32px 28px 80px}
.page-head{margin-bottom:24px}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.page-head p{font-size:13.5px;color:var(--stone);margin-top:4px;max-width:56ch}

/* ===== FILTER TABS ===== */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
.tab{position:relative;font-size:13.5px;font-weight:700;letter-spacing:-.01em;color:var(--stone);background:none;border:none;padding:10px 14px 12px;cursor:pointer;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--coral-deep)}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1.5px;height:2.5px;background:var(--coral);border-radius:2px}
.tab .count{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--border);color:var(--stone);border-radius:999px;padding:1px 7px;vertical-align:1px}
.tab.active .count{background:var(--coral-faint);color:var(--coral-deep)}
.tab:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}

/* ===== REPORT CARD ===== */
.report{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.report-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}
.rtype{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:6px}
.rtype-sba{background:rgba(26,74,138,.1);color:#1a4a8a}
.rtype-mtf{background:rgba(90,26,138,.1);color:#5a1a8a}
.rtype-emq{background:rgba(26,122,90,.1);color:#1a7a5a}
.rstatus{font-size:11px;font-weight:700;letter-spacing:-.01em;padding:3px 10px;border-radius:999px;border:1.5px solid}
.rstatus-open{background:var(--amber-soft);border-color:rgba(245,165,36,.4);color:#8a5a00}
.rstatus-reviewed{background:rgba(26,74,138,.09);border-color:rgba(26,74,138,.28);color:#1a4a8a}
.rstatus-resolved{background:rgba(26,122,90,.1);border-color:rgba(26,122,90,.3);color:#146149}
.rtime{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--stone-light)}

.rq{font-size:14px;line-height:1.6;color:var(--ink-soft);background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:13px}
.rq.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rq-more{font-size:12px;font-weight:700;color:var(--coral-deep);background:none;border:none;cursor:pointer;padding:4px 0 0}
.rq-more:hover{text-decoration:underline}

.rreason{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:-.01em;color:var(--coral-deep);background:var(--coral-faint);border:1.5px solid rgba(240,98,60,.28);border-radius:999px;padding:3px 11px;margin-bottom:10px}
.rcomment{font-size:14.5px;line-height:1.62;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.rmeta{margin-top:12px;font-size:12px;color:var(--stone)}
.rmeta strong{font-weight:700;color:var(--ink-soft)}

.report-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px dashed var(--border-strong)}
.ra-btn{font-size:12.5px;font-weight:700;letter-spacing:-.01em;padding:8px 14px;border-radius:9px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:border-color .15s,background .15s,color .15s,transform .15s}
.ra-btn:hover{border-color:var(--stone);transform:translateY(-1px)}
.ra-btn:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.ra-btn[disabled]{opacity:.55;cursor:progress;transform:none}
.ra-btn-primary{background:var(--coral);border-color:var(--coral);color:#fff}
.ra-btn-primary:hover{background:var(--coral-deep)}
.ra-btn-danger{background:transparent;border-color:rgba(192,57,43,.3);color:var(--wrong)}
.ra-btn-danger:hover{background:rgba(192,57,43,.08);border-color:var(--wrong)}
.ra-link{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--stone);display:inline-flex;align-items:center;gap:5px;padding:8px 4px;transition:color .15s}
.ra-link:hover{color:var(--coral-deep)}
.ra-link svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ===== STATES ===== */
.state{text-align:center;padding:64px 20px;color:var(--stone)}
.state svg{width:34px;height:34px;stroke:var(--stone-light);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
.state h3{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
.state p{font-size:13px}

/* ===== AUTH GATE ===== */
.auth-gate{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px);padding:40px 20px}
.auth-gate-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:36px;max-width:380px;width:100%}
.auth-gate-card h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.auth-gate-card p{font-size:13.5px;color:var(--stone);line-height:1.55;margin-bottom:20px}
.auth-gate-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.auth-gate-error{display:none;background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.32);color:#c0392b;font-size:13px;font-weight:500;padding:10px 14px;border-radius:10px;margin-bottom:14px;line-height:1.5}
.auth-gate-error.show{display:block}
.auth-gate-user{font-family:var(--mono);font-size:12px;color:var(--stone);background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:16px}
label.field-label{font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
input.field{width:100%;padding:10px 13px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--cream);font-size:14px;color:var(--ink);transition:border-color .15s;line-height:1.5}
input.field:focus{outline:none;border-color:var(--coral)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:background .18s,border-color .18s,transform .18s;letter-spacing:-.01em}
.btn-primary{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn-primary:hover{background:var(--coral-deep);transform:translateY(-1px)}
.btn-secondary{background:transparent;color:var(--stone);border-color:var(--border-strong)}
.btn-secondary:hover{border-color:var(--stone);color:var(--ink)}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:28px;right:28px;z-index:999;background:var(--ink);color:#fff;font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:none}

@media (max-width:640px){
  .wrap{padding:22px 16px 60px}
  .topbar{padding:0 16px}
  .topbar-badge{display:none}
  .rtime{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== FEEDBACK VIEW ===== */
.wrap.fbwrap{max-width:980px}
.sumstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.sumcard{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.sumcard .k{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.sumcard .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px;color:var(--ink)}
.sumcard .v small{font-size:13px;font-weight:600;color:var(--stone);margin-left:3px}
.sumcard .split{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--coral-faint);color:var(--coral-deep);border:1.5px solid rgba(240,98,60,.25)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:10px 13px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--surface);font-size:14px;color:var(--ink)}
.toolbar input[type=search]:focus,.toolbar select:focus{outline:none;border-color:var(--coral)}
.toolbar select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--surface);font-size:13.5px;color:var(--ink)}
.toolbar .count{font-family:var(--mono);font-size:12px;color:var(--stone)}
.csv-btn{margin-left:auto;padding:10px 16px;border-radius:10px;border:1.5px solid var(--coral);background:var(--coral);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}
.csv-btn:hover{background:var(--coral-deep);transform:translateY(-1px)}
.csv-btn:active{transform:none}
.csv-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fcard{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:15px 18px;width:100%;background:none;border:none;text-align:left;cursor:pointer;border-radius:16px;color:inherit}
.fhead:hover{background:var(--surface-warm)}
.fhead:focus-visible{outline:2px solid var(--coral);outline-offset:-2px}
.fwho{font-size:14.5px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.fwho small{display:block;font-weight:500;color:var(--stone);font-size:12.5px}
.favg{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--amber-soft);color:#8a5a00;border-radius:999px;padding:3px 10px}
.fcode{font-family:var(--mono);font-size:11.5px;color:var(--coral-deep);background:var(--coral-faint);border-radius:6px;padding:3px 8px}
.fred{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;border:1.5px solid}
.fred-yes{background:rgba(26,122,90,.1);border-color:rgba(26,122,90,.3);color:#146149}
.fred-no{background:var(--cream);border-color:var(--border-strong);color:var(--stone)}
.fdate{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--stone-light)}
.fbody{display:none;padding:2px 18px 18px;border-top:1px dashed var(--border-strong)}
.fcard.open .fbody{display:block}
.qa{margin-top:14px}
.qa .ql{font-size:12px;font-weight:700;color:var(--stone);letter-spacing:-.005em}
.qa .qv{font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word;margin-top:3px}
.qa .qv.rating{font-family:var(--mono);font-weight:600;color:var(--coral-deep)}
.qa.unknown .ql{color:var(--stone-light);font-style:italic}
@media (max-width:640px){.fdate{margin-left:0;width:100%}.csv-btn{margin-left:0;width:100%}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 100 100">
      <path fill="none" stroke="var(--mark-stroke,#F0623C)" stroke-width="14" stroke-linecap="round" d="M68.35 23.79 A32 32 0 1 1 31.65 23.79"/>
      <circle fill="var(--mark-dot,#F5A524)" cx="50" cy="13" r="8.5"/>
    </svg>
    <span>Pain<span class="rev">Revision</span></span>
  </div>
  <span class="topbar-badge">Admin</span>
  <nav class="topbar-nav">
    <a href="admin.html">Questions</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-feedback.html" class="active">Feedback</a>
  </nav>
  <div class="topbar-actions">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="tb-btn" id="logout-btn" style="display:none">Log out</button>
  </div>
</div>

<!-- AUTH GATE -->
<div class="auth-gate" id="auth-gate" style="display:none">
  <div class="auth-gate-card" id="auth-gate-card"></div>
</div>

<!-- MAIN -->
<div class="wrap fbwrap" id="fb-layout" style="display:none">
  <div class="page-head">
    <h1>Member feedback</h1>
    <p>Responses to the member feedback form, newest first. Read the answers, search, sort, or download everything as CSV.</p>
  </div>
  <div class="sumstrip" id="summary"></div>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search email, name or answers…" aria-label="Search feedback"/>
    <select id="sort" aria-label="Sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="high">Highest rating</option>
      <option value="low">Lowest rating</option>
    </select>
    <span class="count" id="count"></span>
    <button class="csv-btn" id="csv-btn" type="button">Download CSV</button>
  </div>
  <div id="list"></div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
let questions = [];
let subs = [];
let redeemedKnown = false;

/* ===== AUTH GATE (mirrors admin.html) ===== */
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await checkAdminAndProceed(session.user);
  else showLoginForm();

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) checkAdminAndProceed(session.user);
    if (event === 'SIGNED_OUT') location.reload();
  });
}

async function checkAdminAndProceed(user) {
  const { data: profile, error } = await sb.from('profiles').select('role,username').eq('id', user.id).single();
  if (error || !profile || profile.role !== 'admin') {
    showNotAuthorized(user.email);
    return;
  }
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('fb-layout').style.display = 'block';
  document.getElementById('topbar-user').textContent = profile.username || user.email;
  document.getElementById('logout-btn').style.display = '';
  loadFeedback();
}

function showLoginForm() {
  document.getElementById('auth-gate-card').innerHTML = `
    <h2>Admin sign in</h2>
    <p>Sign in with your PainRevision admin account to read member feedback.</p>
    <div class="auth-gate-error" id="auth-gate-error"></div>
    <form id="auth-gate-form">
      <div class="auth-gate-group">
        <label class="field-label" for="ag-email">Email</label>
        <input class="field" type="email" id="ag-email" autocomplete="email" required/>
      </div>
      <div class="auth-gate-group">
        <label class="field-label" for="ag-password">Password</label>
        <input class="field" type="password" id="ag-password" autocomplete="current-password" required/>
      </div>
      <button class="btn btn-primary" type="submit" id="ag-submit" style="width:100%;margin-top:6px">Log in</button>
    </form>`;
  document.getElementById('auth-gate').style.display = 'flex';
  document.getElementById('fb-layout').style.display = 'none';

  document.getElementById('auth-gate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('auth-gate-error');
    errEl.classList.remove('show');
    const email = document.getElementById('ag-email').value.trim();
    const password = document.getElementById('ag-password').value;
    const btn = document.getElementById('ag-submit');
    btn.disabled = true; btn.textContent = 'Logging in…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Log in';
    if (error) {
      errEl.textContent = error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : error.message;
      errEl.classList.add('show');
    }
  });
}

function showNotAuthorized(email) {
  document.getElementById('auth-gate-card').innerHTML = `
    <h2>Not authorized</h2>
    <p>This account doesn't have admin access on PainRevision.</p>
    <div class="auth-gate-user">Signed in as ${escHtml(email)}</div>
    <button class="btn btn-secondary" id="ag-logout" style="width:100%">Log out</button>`;
  document.getElementById('auth-gate').style.display = 'flex';
  document.getElementById('fb-layout').style.display = 'none';
  document.getElementById('ag-logout').addEventListener('click', () => sb.auth.signOut());
}

document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut());


/* ===== LOAD (via the admin-only endpoint; no direct table access) ===== */
async function loadFeedback() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="state"><p>Loading feedback…</p></div>';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/admin-feedback', { headers: { Authorization: 'Bearer ' + session.access_token } });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Could not load feedback');
    questions = body.questions || [];
    subs = body.submissions || [];
    redeemedKnown = !!body.redeemedKnown;
  } catch (err) {
    list.innerHTML = '<div class="state"><h3>Couldn\'t load feedback</h3><p>' + escHtml(err.message) + '</p></div>';
    return;
  }
  renderSummary();
  render();
}

function ratingQs() { return questions.filter(q => q.type === 'rating'); }
function choiceQs() { return questions.filter(q => q.type === 'choice'); }

function avgRating(s) {
  const v = ratingQs().map(q => Number(s.answers[q.id])).filter(n => n >= 1 && n <= 5);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function renderSummary() {
  const el = document.getElementById('summary');
  let html = '<div class="sumcard"><div class="k">Responses</div><div class="v">' + subs.length + '</div></div>';
  ratingQs().forEach(q => {
    const v = subs.map(s => Number(s.answers[q.id])).filter(n => n >= 1 && n <= 5);
    const avg = v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) : '–';
    html += '<div class="sumcard"><div class="k">' + escHtml(q.label.length > 46 ? q.label.slice(0, 44) + '…' : q.label) + '</div><div class="v">' + avg + '<small>/ 5</small></div></div>';
  });
  choiceQs().forEach(q => {
    const counts = {};
    subs.forEach(s => { const a = s.answers[q.id]; if (typeof a === 'string') counts[a] = (counts[a] || 0) + 1; });
    const order = (q.options || []).concat(Object.keys(counts).filter(k => !(q.options || []).includes(k)));
    html += '<div class="sumcard"><div class="k">' + escHtml(q.label.length > 46 ? q.label.slice(0, 44) + '…' : q.label) + '</div><div class="split">' +
      order.map(o => '<span class="chip">' + escHtml(o) + ': ' + (counts[o] || 0) + '</span>').join('') + '</div></div>';
  });
  if (!redeemedKnown && subs.length) html += '<div class="sumcard"><div class="k">Redeemed</div><div class="v"><small>not available</small></div></div>';
  else if (subs.length) html += '<div class="sumcard"><div class="k">Codes redeemed</div><div class="v">' + subs.filter(s => s.redeemed).length + '<small>/ ' + subs.length + '</small></div></div>';
  el.innerHTML = html;
}

function answerText(v) {
  if (Array.isArray(v)) return v.join(', ');
  return v === undefined || v === null ? '' : String(v);
}

function searchText(s) {
  return [s.email, s.name, s.username, s.code].concat(Object.values(s.answers).map(answerText)).join(' \n ').toLowerCase();
}

function view() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;
  let rows = subs.filter(s => !q || searchText(s).includes(q));
  const t = s => new Date(s.created_at).getTime();
  const r = s => { const a = avgRating(s); return a === null ? 0 : a; };
  if (sort === 'oldest') rows.sort((a, b) => t(a) - t(b));
  else if (sort === 'high') rows.sort((a, b) => r(b) - r(a) || t(b) - t(a));
  else if (sort === 'low') rows.sort((a, b) => r(a) - r(b) || t(b) - t(a));
  else rows.sort((a, b) => t(b) - t(a));
  return rows;
}

function fmtDate(iso) {
  return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function render() {
  const list = document.getElementById('list');
  const rows = view();
  document.getElementById('count').textContent = rows.length + ' of ' + subs.length;
  if (!subs.length) {
    list.innerHTML = '<div class="state"><h3>No feedback yet</h3><p>Responses will appear here once members fill in the form.</p></div>';
    return;
  }
  if (!rows.length) {
    list.innerHTML = '<div class="state"><h3>No matches</h3><p>Try a different search.</p></div>';
    return;
  }
  const known = new Set(questions.map(q => q.id));
  list.innerHTML = rows.map((s, i) => {
    const avg = avgRating(s);
    const who = s.name || s.username || s.email || 'Unknown member';
    const sub = [s.email, s.username && s.name ? '@' + s.username : null].filter(Boolean).join(' · ');
    const redeemed = s.redeemed === null ? '' : '<span class="fred ' + (s.redeemed ? 'fred-yes' : 'fred-no') + '">' + (s.redeemed ? 'Redeemed' : 'Not redeemed') + '</span>';
    const qa = questions.filter(q => s.answers[q.id] !== undefined).map(q =>
      '<div class="qa"><div class="ql">' + escHtml(q.label) + '</div><div class="qv' + (q.type === 'rating' ? ' rating' : '') + '">' +
      escHtml(q.type === 'rating' ? answerText(s.answers[q.id]) + ' / 5' : answerText(s.answers[q.id])) + '</div></div>').join('') +
      Object.keys(s.answers).filter(k => !known.has(k)).map(k =>
        '<div class="qa unknown"><div class="ql">' + escHtml(k) + ' (no longer in the form)</div><div class="qv">' + escHtml(answerText(s.answers[k])) + '</div></div>').join('');
    return '<div class="fcard" data-i="' + i + '">' +
      '<button class="fhead" type="button" aria-expanded="false">' +
        '<span class="fwho">' + escHtml(who) + (sub ? '<small>' + escHtml(sub) + '</small>' : '') + '</span>' +
        (avg !== null ? '<span class="favg">' + avg.toFixed(1) + ' avg</span>' : '') +
        '<span class="fcode">' + escHtml(s.code) + '</span>' + redeemed +
        '<span class="fdate">' + escHtml(fmtDate(s.created_at)) + '</span>' +
      '</button><div class="fbody">' + (qa || '<div class="qa"><div class="qv">No answers recorded.</div></div>') + '</div></div>';
  }).join('');
}

document.getElementById('list').addEventListener('click', e => {
  const head = e.target.closest('.fhead');
  if (!head) return;
  const card = head.parentElement;
  const open = card.classList.toggle('open');
  head.setAttribute('aria-expanded', String(open));
});
document.getElementById('search').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);

/* ===== CSV ===== */
function csvCell(v) {
  let s = answerText(v).replace(/\r?\n/g, ' ');
  if (/^[=+\-@\t]/.test(s)) s = "'" + s; // neutralise spreadsheet formulas
  return '"' + s.replace(/"/g, '""') + '"';
}
document.getElementById('csv-btn').addEventListener('click', () => {
  const known = new Set(questions.map(q => q.id));
  const extra = [];
  subs.forEach(s => Object.keys(s.answers).forEach(k => { if (!known.has(k) && !extra.includes(k)) extra.push(k); }));
  const header = ['Email', 'Username', 'Name', 'Submitted (ISO)', 'Code', 'Redeemed'].concat(questions.map(q => q.label), extra.map(k => k + ' (old question)'));
  const lines = [header.map(csvCell).join(',')];
  view().forEach(s => {
    lines.push([s.email, s.username, s.name, s.created_at, s.code, s.redeemed === null ? 'unknown' : (s.redeemed ? 'yes' : 'no')]
      .concat(questions.map(q => s.answers[q.id]), extra.map(k => s.answers[k])).map(csvCell).join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'painrevision-feedback-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV downloaded');
});

/* ===== TOAST ===== */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
}

initAuth();
</script>
