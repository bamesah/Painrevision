<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — PainRevision</title>
<meta name="description" content="Log in to your PainRevision account to continue practising FFPMRCA MCQs."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ===== RESET & ROOT ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{
  --coral:#F0623C;--coral-deep:#D2491F;--coral-soft:#FBD9CC;
  --amber:#F5A524;--amber-soft:#FCE6BF;
  --ink:#241B16;--ink-soft:#3A2D25;
  --stone:#7C7068;--stone-light:#A99E95;
  --cream:#FBF5EE;--surface:#FFFFFF;--surface-warm:#FFFAF4;
  --border:#EDE3D7;--border-strong:#E0D3C4;
  --shadow:0 1px 2px rgba(36,27,22,.04),0 18px 40px -22px rgba(36,27,22,.22);
  --shadow-sm:0 1px 2px rgba(36,27,22,.05),0 8px 20px -14px rgba(36,27,22,.18);
  --r:18px;--maxw:1120px;
  --san:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--san);background:var(--cream);color:var(--ink);line-height:1.5;overflow-x:hidden}
::selection{background:var(--coral);color:#fff}
img,svg{display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
.eyebrow{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);display:inline-block}

/* ===== NAVIGATION ===== */
.nav{position:sticky;top:0;z-index:100;transition:background .3s,box-shadow .3s;background:rgba(251,245,238,0);border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(251,245,238,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom-color:var(--border);box-shadow:var(--shadow-sm)}
.nav-in{display:flex;align-items:center;gap:16px;padding:16px 32px;max-width:var(--maxw);margin:0 auto}
.nav-logo{display:flex;align-items:center;gap:11px;font-family:var(--san);font-weight:800;font-size:18px;letter-spacing:-.03em;flex-shrink:0}
.nav-logo svg{width:32px;height:32px;flex-shrink:0}
.nav-logo .pain{color:var(--ink)}
.nav-logo .rev{color:var(--coral)}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav-links a{font-size:14.5px;font-weight:500;color:var(--stone);padding:8px 14px;border-radius:999px;transition:color .18s,background .18s}
.nav-links a:hover{color:var(--ink);background:var(--surface-warm)}
.nav-links a.active{color:var(--ink);font-weight:600;background:rgba(36,27,22,.06)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;margin-left:auto;background:none;border:none;-webkit-tap-highlight-color:transparent}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--ink);border-radius:99px;transition:transform .3s,opacity .3s}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-drawer{position:fixed;inset:0;z-index:99;pointer-events:none}
.nav-drawer-overlay{position:absolute;inset:0;background:rgba(36,27,22,.4);opacity:0;transition:opacity .3s}
.nav-drawer-panel{position:absolute;top:56px;right:0;width:min(210px,68vw);background:rgba(251,245,238,.96);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);padding:8px 12px 16px;border-radius:0 0 0 16px;border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;gap:2px;box-shadow:-4px 12px 32px -8px rgba(36,27,22,.18)}
.nav-drawer.open{pointer-events:all}
.nav-drawer.open .nav-drawer-overlay{opacity:1}
.nav-drawer.open .nav-drawer-panel{transform:none}
.nav-drawer-panel a{font-size:15px;font-weight:600;color:var(--ink);padding:9px 12px;border-radius:10px;display:block;transition:background .18s}
.nav-drawer-panel a:hover{background:rgba(36,27,22,.06)}

/* ===== PAGE HERO — compact ===== */
.page-hero{padding:52px 0 32px;position:relative;overflow:hidden;text-align:center}
.hero-glow{position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(560px 340px at 50% -5%,rgba(245,165,36,.16),transparent 65%),
    radial-gradient(680px 420px at 50% 0%,rgba(240,98,60,.10),transparent 60%)}
.page-hero .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.hero-mark{width:48px;height:48px;margin-bottom:14px}
.hero-mark-svg .m-loop{fill:none;stroke:#F0623C;stroke-width:14;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw-loop 1.15s .1s cubic-bezier(.5,0,.2,1) forwards}
.hero-mark-svg .m-dot{fill:#F5A524;opacity:0;transform-origin:50px 13px;animation:pop-dot .5s 1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes draw-loop{to{stroke-dashoffset:0}}
@keyframes pop-dot{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.hero-mark-svg .m-loop,.hero-mark-svg .m-dot{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
.page-hero-eyebrow{margin-bottom:10px}
.page-hero h1{font-size:clamp(28px,4.5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:8px}
.page-hero-tag{font-size:15px;color:var(--stone);max-width:360px;line-height:1.5}

/* ===== AUTH CARD ===== */
.auth-section{padding:8px 0 100px}
.auth-wrap{max-width:440px;margin:0 auto;padding:0 32px}
.auth-card{background:var(--surface);border:1.5px solid var(--border);border-radius:calc(var(--r) + 4px);padding:40px;box-shadow:var(--shadow)}
.form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.form-group:last-of-type{margin-bottom:0}
.form-label-row{display:flex;align-items:center;justify-content:space-between}
.form-label{font-size:13.5px;font-weight:600;color:var(--ink-soft);letter-spacing:-.01em}
.form-forgot{font-size:12.5px;color:var(--coral);font-weight:600}
.form-forgot:hover{text-decoration:underline}
.form-input{width:100%;font-family:var(--san);font-size:15px;color:var(--ink);background:var(--surface-warm);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;-webkit-appearance:none;appearance:none}
.form-input::placeholder{color:var(--stone-light)}
.form-input:hover{border-color:var(--border-strong)}
.form-input:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(240,98,60,.12);background:var(--surface)}
.auth-error{display:none;background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.32);color:#C0392B;font-size:13.5px;font-weight:500;padding:12px 16px;border-radius:10px;margin-bottom:20px;line-height:1.5}
.auth-error.show{display:block}
.btn-submit{width:100%;justify-content:center;margin-top:8px;background:var(--coral);color:#fff;border:2px solid var(--coral);border-radius:999px;font-family:var(--san);font-size:15px;font-weight:600;padding:15px 32px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;letter-spacing:-.01em;transition:transform .22s cubic-bezier(.2,.7,.2,1),background .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s cubic-bezier(.2,.7,.2,1)}
.btn-submit:hover{background:var(--coral-deep);border-color:var(--coral-deep);transform:translateY(-1px);box-shadow:0 6px 20px -6px rgba(240,98,60,.5)}
.btn-submit:active{transform:translateY(0);box-shadow:none}
.btn-submit[disabled]{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.auth-switch{text-align:center;margin-top:24px;font-size:14px;color:var(--stone)}
.auth-switch a{color:var(--coral);font-weight:600}
.auth-switch a:hover{text-decoration:underline}

/* ===== FOOTER ===== */
footer{background:var(--ink);padding:52px 0}
.footer-inner{display:flex;flex-direction:column;align-items:center;gap:28px}
.f-logo{display:flex;align-items:center;gap:12px}
.f-logo svg{width:38px;height:38px;flex-shrink:0}
.f-logo .wm{font-size:22px;font-weight:800;letter-spacing:-.03em}
.f-logo .wm .a{color:#fff}
.f-logo .wm .b{color:var(--amber)}
.footer-social{display:flex;gap:12px}
.social-btn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.social-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.social-btn svg{width:18px;height:18px;fill:rgba(255,255,255,.7);transition:fill .2s}
.social-btn:hover svg{fill:#fff}
.footer-copy{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.35);letter-spacing:.04em;text-align:center}
.footer-copy .f-domain{color:rgba(255,255,255,.55)}

/* ===== RESPONSIVE ===== */
@media(max-width:760px){
  .nav-links{display:none}
  .nav-hamburger{display:flex}
  .wrap{padding:0 20px}
  .nav-in{padding:14px 20px}
  .auth-wrap{padding:0 20px}
  .auth-card{padding:28px 24px}
}
</style>
</head>
<body>

<!-- ===== HIDDEN SVG DEFS ===== -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="pr-mark" viewBox="0 0 100 100">
      <path fill="none" stroke="var(--mark-stroke,#F0623C)" stroke-width="14" stroke-linecap="round" d="M68.35 23.79 A32 32 0 1 1 31.65 23.79"/>
      <circle fill="var(--mark-dot,#F5A524)" cx="50" cy="13" r="8.5"/>
    </symbol>
  </defs>
</svg>

<!-- ===== NAVIGATION ===== -->
<nav class="nav" id="main-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-in">
    <a class="nav-logo" href="index.html" aria-label="PainRevision home">
      <svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true"><use href="#pr-mark"/></svg>
      <span><span class="pain">Pain</span><span class="rev">Revision</span></span>
    </a>
    <div class="nav-links" role="menubar">
      <a href="index.html" role="menuitem">Home</a>
      <a href="questions.html" role="menuitem">MCQ Practice</a>
      <a href="signup.html" role="menuitem">Sign up</a>
    </div>
    <button class="nav-hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Mobile drawer -->
<div class="nav-drawer" id="nav-drawer" aria-hidden="true">
  <div class="nav-drawer-overlay" id="drawer-overlay"></div>
  <div class="nav-drawer-panel" role="dialog" aria-label="Navigation menu">
    <a href="index.html">Home</a>
    <a href="questions.html">MCQ Practice</a>
    <a href="signup.html">Sign up</a>
  </div>
</div>

<!-- ===== PAGE HERO ===== -->
<section class="page-hero" aria-labelledby="login-heading">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="wrap">
    <div class="hero-mark" aria-hidden="true">
      <svg class="hero-mark-svg" viewBox="0 0 100 100" width="48" height="48">
        <path class="m-loop" fill="none" stroke="#F0623C" stroke-width="14" stroke-linecap="round" d="M68.35 23.79 A32 32 0 1 1 31.65 23.79"/>
        <circle class="m-dot" fill="#F5A524" cx="50" cy="13" r="8.5"/>
      </svg>
    </div>
    <span class="eyebrow page-hero-eyebrow">Welcome back</span>
    <h1 id="login-heading"><span class="pain">Log </span><span class="rev">in</span></h1>
    <p class="page-hero-tag">Continue where you left off.</p>
  </div>
</section>

<!-- ===== AUTH CARD ===== -->
<section class="auth-section">
  <div class="auth-wrap">
    <div class="auth-card">

      <div class="auth-error" id="auth-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="li-email">Email</label>
          <input class="form-input" type="email" id="li-email" name="email" placeholder="n.dorphin@example.com" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="li-password">Password</label>
            <a class="form-forgot" href="forgot-password.html">Forgot password?</a>
          </div>
          <input class="form-input" type="password" id="li-password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button class="btn-submit" type="submit" id="submit-btn">Log in</button>
      </form>

    </div>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer>
  <div class="wrap">
    <div class="footer-inner">
      <div class="f-logo">
        <svg viewBox="0 0 100 100" width="38" height="38" aria-hidden="true" style="--mark-stroke:#fff;--mark-dot:#F5A524"><use href="#pr-mark"/></svg>
        <span class="wm"><span class="a">Pain</span><span class="b">Revision</span></span>
      </div>
      <div class="footer-social" aria-label="Social media links">
        <a href="https://www.youtube.com/@PainRevision" class="social-btn" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.54C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#241B16"/></svg>
        </a>
      </div>
      <p class="footer-copy">© 2026 <span class="f-domain">painrevision.com</span> · All rights reserved</p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(function(){
  var nav = document.getElementById('main-nav');
  function onScroll(){ nav.classList.toggle('scrolled', window.scrollY > 20); }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  var hamburger = document.getElementById('hamburger');
  var drawer = document.getElementById('nav-drawer');
  var overlay = document.getElementById('drawer-overlay');
  function openDrawer(){ drawer.querySelector('.nav-drawer-panel').style.top = nav.getBoundingClientRect().bottom + 'px'; hamburger.classList.add('open'); hamburger.setAttribute('aria-expanded','true'); drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
  function closeDrawer(){ hamburger.classList.remove('open'); hamburger.setAttribute('aria-expanded','false'); drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
  hamburger.addEventListener('click', function(){ drawer.classList.contains('open') ? closeDrawer() : openDrawer(); });
  overlay.addEventListener('click', closeDrawer);
  drawer.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeDrawer); });
})();

(function(){
  var form = document.getElementById('login-form');
  var errorBox = document.getElementById('auth-error');
  var submitBtn = document.getElementById('submit-btn');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError(){
    errorBox.classList.remove('show');
    errorBox.textContent = '';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    clearError();

    var email = document.getElementById('li-email').value.trim();
    var password = document.getElementById('li-password').value;

    if(!email || !password){
      showError('Please enter your email and password.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Log in';

    if(error){
      showError(error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : (error.message || 'Something went wrong — please try again.'));
      return;
    }

    window.location.href = 'questions.html';
  });
})();
</script>
</body>
</html>
